function emotionLabel(v) { return v<20?"Anxious":v<35?"Stressed":v<50?"Unsure":v<65?"Neutral":v<80?"Calm":v<90?"Focused":"Confident"; }
function emotionColor(v) { return `hsl(${v*2.4},80%,58%)`; }
function gradeColor(g) { return g==="A+"?"#22c55e":g==="A"?"#4ade80":g==="B"?"#3b82f6":g==="C"?"#eab308":g==="D"?"#f97316":"#ef4444"; }

function calcStats(trades) {
  if (!trades.length) return { total:0, wins:0, losses:0, winRate:"0.0", netPnl:0, profitFactor:"0.00", avgWin:0, avgLoss:0, avgEmotion:50, ruleAdh:0, wlRatio:0, consistency:50, tradepath:0 };
  const wins=trades.filter(t=>t.win), losses=trades.filter(t=>!t.win);
  const netPnl=trades.reduce((s,t)=>s+parseFloat(t.netPnl||0),0);
  const grossWin=wins.reduce((s,t)=>s+parseFloat(t.netPnl||0),0);
  const grossLoss=Math.abs(losses.reduce((s,t)=>s+parseFloat(t.netPnl||0),0));
  const winRate=(wins.length/trades.length)*100;
  const avgWin=wins.length?grossWin/wins.length:0;
  const avgLoss=losses.length?grossLoss/losses.length:0;
  const pf=grossLoss>0?grossWin/grossLoss:grossWin>0?9:0;
  const avgEmotion=trades.reduce((s,t)=>s+(t.emotion||50),0)/trades.length;
  const ruleAdh=trades.reduce((s,t)=>{const r=Object.values(t.rules||{});return s+(r.filter(Boolean).length/r.length)*100;},0)/trades.length;
  const wlRatio=avgLoss>0?avgWin/avgLoss:avgWin>0?5:0;
  const pnls=trades.map(t=>parseFloat(t.netPnl||0));
  const mean=pnls.reduce((a,b)=>a+b,0)/pnls.length;
  const std=Math.sqrt(pnls.reduce((a,b)=>a+(b-mean)**2,0)/pnls.length);
  const consistency=mean!==0?Math.max(0,Math.min(100,100-(std/Math.abs(mean))*15)):50;
  const tradepath=(Math.min(winRate,100)*0.2+Math.min(ruleAdh,100)*0.25+Math.min(pf*10,100)*0.2+Math.min(wlRatio*25,100)*0.15+consistency*0.2);
  return { total:trades.length, wins:wins.length, losses:losses.length, winRate:winRate.toFixed(1), netPnl:netPnl.toFixed(2), profitFactor:pf.toFixed(2), avgWin:avgWin.toFixed(2), avgLoss:avgLoss.toFixed(2), avgEmotion, ruleAdh, wlRatio, consistency, tradepath };
}

function EmoFace({ val, size=56 }) {
  const col=emotionColor(val), s=size;
  const smile=val>=48;
  const mouth=smile?`M${s*.32} ${s*.6} Q${s*.5} ${s*.74} ${s*.68} ${s*.6}`:`M${s*.32} ${s*.66} Q${s*.5} ${s*.52} ${s*.68} ${s*.66}`;
  return (
    <svg width={s} height={s} viewBox={`0 0 ${s} ${s}`}>
      <defs><radialGradient id={`eg${s}`}><stop offset="0%" stopColor={col} stopOpacity="0.25"/><stop offset="100%" stopColor={col} stopOpacity="0.05"/></radialGradient></defs>
      <circle cx={s/2} cy={s/2} r={s/2-1} fill={`url(#eg${s})`} stroke={col} strokeWidth="1.5"/>
      <circle cx={s*.36} cy={s*.42} r={s*.065} fill={col}/>
      <circle cx={s*.64} cy={s*.42} r={s*.065} fill={col}/>
      <path d={mouth} stroke={col} strokeWidth="2" fill="none" strokeLinecap="round"/>
    </svg>
  );
}

function SemiGauge({ pct=0, wins=0, losses=0, be=0 }) {
  const r=54, cx=70, cy=70, sw=10;
  const arc=(p)=>{
    const a=Math.PI*(1-p), x=cx+r*Math.cos(a), y=cy-r*Math.sin(a);
    return `M${cx-r},${cy} A${r},${r} 0 0,1 ${x},${y}`;
  };
  const p=Math.min(pct/100,1);
  return (
    <div style={{textAlign:"center"}}>
      <svg width={140} height={80} viewBox="0 0 140 80">
        <path d={`M${cx-r},${cy} A${r},${r} 0 0,1 ${cx+r},${cy}`} fill="none" stroke={C.border} strokeWidth={sw} strokeLinecap="round"/>
        {p>0 && <path d={arc(p)} fill="none" stroke={C.green} strokeWidth={sw} strokeLinecap="round"/>}
        <text x={cx} y={cy-8} textAnchor="middle" fill={C.text} fontSize="22" fontWeight="800" fontFamily="system-ui">{pct.toFixed(1)}%</text>
      </svg>
      <div style={{display:"flex",justifyContent:"center",gap:16,marginTop:-8}}>
        <div style={{textAlign:"center"}}><div style={{fontSize:18,fontWeight:800,color:C.green}}>{wins}</div><div style={{fontSize:10,color:C.muted}}>Win</div></div>
        <div style={{textAlign:"center"}}><div style={{fontSize:18,fontWeight:800,color:C.red}}>{losses}</div><div style={{fontSize:10,color:C.muted}}>Loss</div></div>
        <div style={{textAlign:"center"}}><div style={{fontSize:18,fontWeight:800,color:C.muted}}>{be}</div><div style={{fontSize:10,color:C.muted}}>BE</div></div>
      </div>
    </div>
  );
}

function Ring({ val, max=100, color, label, size=70 }) {
  const r=size*.38, c=2*Math.PI*r, pct=Math.min(val/max,1), dash=pct*c;
  return (
    <div style={{position:"relative",width:size,height:size}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.border} strokeWidth={size*.09}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={size*.09} strokeDasharray={`${dash} ${c}`} strokeLinecap="round"/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:1}}>
        <div style={{fontSize:size*.22,fontWeight:800,color}}>{val}</div>
        <div style={{fontSize:size*.14,color:C.muted}}>{label}</div>
      </div>
    </div>
  );
}

}

function Tag({ label, onRemove, color=C.green }) {

    </span>
  );
}

function SectionHead({ children }) {
  return <div style={{color:C.text,fontSize:13,fontWeight:700,marginBottom:14,paddingBottom:10,borderBottom:`1px solid ${C.border}`,fontFamily:"system-ui",letterSpacing:"0.02em"}}>{children}</div>;
}

function App() {
  const [page, setPage]=useState("dashboard");
  const [trades, setTrades]=useState(()=>{
    try {
      const saved=localStorage.getItem('tj-trades');
      return saved ? JSON.parse(saved) : INIT_TRADES;
    } catch { return INIT_TRADES; }
  });

  useEffect(()=>{
    localStorage.setItem('tj-trades', JSON.stringify(trades));
  },[trades]);
  const [showForm, setShowForm]=useState(false);
  const [form, setForm]=useState(EMPTY);
  const [editId, setEditId]=useState(null);
  const [dailyLogs, setDailyLogs]=useState({});
  const [dailyDate, setDailyDate]=useState(new Date().toISOString().split("T")[0]);
  const [filterDate, setFilterDate]=useState("");
  const [session, setSession]=useState(null);
  const [showTagDrop, setShowTagDrop]=useState(false);
  const [showSymDrop, setShowSymDrop]=useState(false);
  const fileRef=useRef();

  const stats=useMemo(()=>calcStats(trades),[trades]);

  function openNew() { setForm({...EMPTY}); setEditId(null); setShowForm(true); }
  function openEdit(t) { setForm({...t}); setEditId(t.id); setShowForm(true); }
  function deleteTrade(id) { setTrades(ts=>ts.filter(t=>t.id!==id)); }

  function saveTrade() {
    const t={...form, netPnl:parseFloat(form.netPnl)||0, win:(parseFloat(form.netPnl)||0)>0};
    if (editId!==null) setTrades(ts=>ts.map(x=>x.id===editId?{...t,id:editId}:x));
    else setTrades(ts=>[{...t,id:Date.now()},...ts]);
    setShowForm(false);
  }

  function addTag(tag) {
    if (!tag||form.tags.includes(tag)) return;
    setForm(f=>({...f,tags:[...f.tags,tag]}));
  }
  function removeTag(tag) { setForm(f=>({...f,tags:f.tags.filter(t=>t!==tag)})); }

  function handleScreen(e) {
    const file=e.target.files[0]; if (!file) return;
    const reader=new FileReader();
    reader.onload=ev=>setForm(f=>({...f,screens:[...f.screens,{name:file.name,url:ev.target.result,title:""}]}));
    reader.readAsDataURL(file);
    e.target.value="";
  }

  const calendarPnl=useMemo(()=>{
    const m={};
    trades.forEach(t=>{if(!m[t.date])m[t.date]=0; m[t.date]+=parseFloat(t.netPnl||0);});
    return m;
  },[trades]);

  const cumPnl=useMemo(()=>{
    let c=0;
    return [...trades].sort((a,b)=>a.date.localeCompare(b.date)).map((t,i)=>({i:i+1,pnl:(c+=parseFloat(t.netPnl||0))}));
  },[trades]);

  const radarData=[
    {subject:"Win %", A:Math.min(parseFloat(stats.winRate),100)},
    {subject:"Rule Adh.", A:Math.min(stats.ruleAdh,100)},
    {subject:"Profit F.", A:Math.min(parseFloat(stats.profitFactor)*10,100)},
    {subject:"W/L Ratio", A:Math.min(stats.wlRatio*25,100)},
    {subject:"Consistency", A:Math.min(stats.consistency,100)},
  ];

  return (
    <div style={{display:"flex",height:"100vh",background:C.bg,color:C.text,fontFamily:"system-ui,-apple-system,sans-serif",fontSize:13,overflow:"hidden",backgroundImage:"radial-gradient(#ffffff06 1px,transparent 1px)",backgroundSize:"28px 28px"}}>

      {/* SIDEBAR */}

        <div style={{marginBottom:24}}>
          <svg width={28} height={28} viewBox="0 0 28 28"><circle cx={14} cy={14} r={13} fill="none" stroke={C.green} strokeWidth={2}/><circle cx={14} cy={14} r={5} fill={C.green}/></svg>
        </div>
        {NAVS.map(n=>(

            {n.icon}
          </button>
        ))}
      </div>

      {/* MAIN */}
      <div style={{flex:1,overflow:"auto",padding:28}}>

        {/* ── DASHBOARD ── */}
        {page==="dashboard" && (

                <div style={{fontSize:26,fontWeight:800,letterSpacing:"-0.5px"}}>Dashboard</div>

                        </td>
                      </tr>

                {l:"WIN RATE",v:`${stats.winRate}%`,sub:`${stats.wins} of ${stats.total}`,c:C.green},
                {l:"NET P/L",v:`${parseFloat(stats.netPnl)>=0?"+":""}$${parseFloat(stats.netPnl).toLocaleString()}`,sub:"Total after fees",c:parseFloat(stats.netPnl)>=0?C.green:C.red},

                {l:"AVG LOSS",v:`-$${parseFloat(stats.avgLoss).toLocaleString()}`,sub:"Per losing trade",c:C.red},

            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:24}}>

                const checked=trades.filter(t=>t.rules?.[k]).length;
                const pct=trades.length?(checked/trades.length)*100:0;
                return (
                  <Card key={k}>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                      <div style={{width:8,height:8,borderRadius:"50%",background:pct>=75?C.green:pct>=50?C.yellow:C.red}}/>

                if(!sorted.length) return <div style={{color:C.muted,textAlign:"center",padding:20}}>No mistake tags yet 🎯</div>;

                  <div style={{display:"flex",flexDirection:"column",gap:8}}>

                            style={{width:"100%",background:"transparent",color:C.text,border:"none",borderBottom:`1px solid ${C.border}`,padding:"4px 0",fontSize:11,outline:"none",fontFamily:"inherit",boxSizing:"border-box"}}/>

                          <div key={t} onClick={()=>{addTag(t);setShowTagDrop(false);}}
                            style={{padding:"9px 14px",cursor:"pointer",fontSize:12,color:form.tags.includes(t)?C.muted:C.text,background:"transparent",display:"flex",justifyContent:"space-between",alignItems:"center"}}
                            onMouseEnter={e=>e.currentTarget.style.background="#ffffff08"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                            {t}
                            {form.tags.includes(t) && <span style={{color:C.green,fontSize:10}}>✓ added</span>}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                {/* Emotional State */}
                <div>
                  <Lbl>EMOTIONAL STATE</Lbl>
                  <div style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:14,display:"flex",alignItems:"center",gap:14}}>
                    <EmoFace val={form.emotion} size={52}/>
                    <div style={{flex:1}}>
                      <div style={{color:emotionColor(form.emotion),fontWeight:800,fontSize:14,marginBottom:8}}>{emotionLabel(form.emotion)}</div>
                      <div style={{position:"relative",height:10,borderRadius:5,background:"linear-gradient(90deg,#ef4444,#eab308,#22c55e,#3b82f6,#8b5cf6)",cursor:"pointer"}}
                        onClick={e=>{const r=e.currentTarget.getBoundingClientRect();setForm(f=>({...f,emotion:Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*100)}));}}>
                        <div style={{position:"absolute",top:"50%",left:`${form.emotion}%`,transform:"translate(-50%,-50%)",width:17,height:17,borderRadius:"50%",background:"#fff",border:`3px solid ${emotionColor(form.emotion)}`,boxShadow:"0 2px 8px #000a",pointerEvents:"none"}}/>
                      </div>
                      <div style={{display:"flex",justifyContent:"space-between",marginTop:5,color:C.muted,fontSize:9}}>
                        <span>Anxious</span><span>Neutral</span><span>Confident</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* RIGHT — all detail fields */}
              <div style={{padding:18,display:"flex",flexDirection:"column",gap:12,overflowY:"auto",background:C.card2}}>

                {/* Symbol — plain input, dropdown on click */}
                <div style={{position:"relative"}}>
                  <Lbl>SYMBOL</Lbl>
                  <input
                    value={form.symbol}
                    onChange={e=>{setForm(f=>({...f,symbol:e.target.value.toUpperCase()}));setShowSymDrop(true);}}
                    onFocus={()=>setShowSymDrop(true)}
                    onBlur={()=>setTimeout(()=>setShowSymDrop(false),150)}
                    placeholder=""
                    style={{width:"100%",background:C.card2,color:C.text,border:`1px solid ${C.border}`,padding:"10px 12px",borderRadius:8,fontSize:13,fontWeight:400,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
                  {showSymDrop && (
                    <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,zIndex:50,boxShadow:"0 8px 24px #000a",overflow:"hidden",maxHeight:200,overflowY:"auto"}}>
                      {["XAUUSD","NQ","MNQ","ES","MES","EURUSD","GBPUSD","USDJPY","BTC","ETH","GC","MGC","CL"].filter(s=>s.includes(form.symbol)||form.symbol==="").map(s=>(
                        <div key={s} onMouseDown={()=>{setForm(f=>({...f,symbol:s}));setShowSymDrop(false);}}
                          style={{padding:"9px 14px",cursor:"pointer",fontSize:13,fontWeight:600,color:C.text}}
                          onMouseEnter={e=>e.currentTarget.style.background=C.card2}
                          onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                          {s}
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Model */}
                <div><Lbl>MODEL / PLAYBOOK</Lbl><Sel value={form.model} onChange={e=>setForm(f=>({...f,model:e.target.value}))} opts={MODELS}/></div>

                {/* Trade Rules */}
                <div>
                  <div style={{background:`${C.green}11`,border:`1px solid ${C.green}33`,borderRadius:5,padding:"5px 8px",marginBottom:8}}>
                    <div style={{color:C.green,fontSize:9,fontWeight:700}}>📋 Showing rules for {form.date}</div>
                  </div>
                  <Lbl>TRADE RULES</Lbl>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    {Object.entries(RULES).map(([k,label])=>(
                      <div key={k} onClick={()=>setForm(f=>({...f,rules:{...f.rules,[k]:!f.rules[k]}}))}
                        style={{display:"flex",alignItems:"center",gap:9,cursor:"pointer",padding:"7px 9px",borderRadius:6,background:form.rules[k]?`${C.green}11`:"transparent",border:`1px solid ${form.rules[k]?C.green+"44":C.border}`,transition:"all .1s"}}>
                        <div style={{width:14,height:14,borderRadius:3,border:`2px solid ${form.rules[k]?C.green:C.muted}`,background:form.rules[k]?C.green:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          {form.rules[k] && <span style={{color:"#000",fontSize:9,fontWeight:900,lineHeight:1}}>✓</span>}
                        </div>
                        <span style={{fontSize:11,color:form.rules[k]?C.text:C.muted,fontWeight:form.rules[k]?700:400}}>{label}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Setup Entry */}
                <div>
                  <Lbl>SETUP ENTRY</Lbl>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    {Object.entries(SETUP_ENTRY).map(([k,label])=>(
                      <div key={k} onClick={()=>setForm(f=>({...f,setup:{...f.setup,[k]:!f.setup[k]}}))}
                        style={{display:"flex",alignItems:"center",gap:9,cursor:"pointer",padding:"7px 9px",borderRadius:6,background:form.setup?.[k]?`${C.blue}11`:"transparent",border:`1px solid ${form.setup?.[k]?C.blue+"44":C.border}`,transition:"all .1s"}}>
                        <div style={{width:14,height:14,borderRadius:3,border:`2px solid ${form.setup?.[k]?C.blue:C.muted}`,background:form.setup?.[k]?C.blue:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          {form.setup?.[k] && <span style={{color:"#000",fontSize:9,fontWeight:900,lineHeight:1}}>✓</span>}
                        </div>
                        <span style={{fontSize:11,color:form.setup?.[k]?C.text:C.muted,fontWeight:form.setup?.[k]?700:400}}>{label}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Date */}
                <div><Lbl>DATE</Lbl><Inp type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>

                {/* Side */}
                <div>
                  <Lbl>SIDE</Lbl>
                  <div style={{display:"flex",gap:6}}>
                    {["Long","Short"].map(s=>(
                      <button key={s} onClick={()=>setForm(f=>({...f,side:s}))} style={{flex:1,padding:"7px",borderRadius:6,border:`1px solid ${form.side===s?(s==="Long"?C.green:C.red):C.border}`,background:form.side===s?(s==="Long"?`${C.green}22`:`${C.red}22`):"transparent",color:form.side===s?(s==="Long"?C.green:C.red):C.muted,cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>
                        {s==="Long"?"↑ Long":"↓ Short"}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Lot */}
                <div><Lbl>LOT / CONTRACTS</Lbl><Inp type="number" value={form.qty} onChange={e=>setForm(f=>({...f,qty:e.target.value}))} placeholder="1"/></div>

                {/* Entry Price */}
                <div><Lbl>ENTRY PRICE</Lbl><Inp type="number" value={form.entryPrice} onChange={e=>setForm(f=>({...f,entryPrice:e.target.value}))} placeholder="0.00"/></div>

                {/* Stop Loss */}
                <div><Lbl>STOP LOSS</Lbl><Inp type="number" value={form.sl} onChange={e=>setForm(f=>({...f,sl:e.target.value}))} placeholder="0.00"/></div>

                {/* Risk Reward */}
                <div><Lbl>RISK REWARD (PLANNED)</Lbl><Inp type="number" value={form.plannedRR} onChange={e=>setForm(f=>({...f,plannedRR:e.target.value}))} placeholder="e.g. 3.5"/></div>

                {/* Time of Trade — 3 boxes */}
                <div>
                  <Lbl>TIME OF TRADE</Lbl>
                  <div style={{display:"flex",gap:4,alignItems:"flex-end"}}>
                    {[["Hours","tEntryH",23],["Minutes","tEntryM",59],["Seconds","tEntryS",59]].map(([lbl,key,mx])=>(
                      <div key={key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                        <input type="number" min={0} max={mx} value={form[key]||""} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))} placeholder="00"
                          style={{width:"100%",background:C.bg,color:C.text,border:`1px solid ${C.border}`,padding:"10px 4px",borderRadius:7,fontSize:18,fontWeight:800,textAlign:"center",boxSizing:"border-box",outline:"none",fontFamily:"'DM Mono',monospace"}}/>
                        <span style={{color:C.muted,fontSize:9,fontWeight:600}}>{lbl}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Time of Exit — 3 boxes */}
                <div>
                  <Lbl>TIME OF EXIT</Lbl>
                  <div style={{display:"flex",gap:4,alignItems:"flex-end"}}>
                    {[["Hours","tExitH",23],["Minutes","tExitM",59],["Seconds","tExitS",59]].map(([lbl,key,mx])=>(
                      <div key={key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                        <input type="number" min={0} max={mx} value={form[key]||""} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))} placeholder="00"
                          style={{width:"100%",background:C.bg,color:C.text,border:`1px solid ${C.border}`,padding:"10px 4px",borderRadius:7,fontSize:18,fontWeight:800,textAlign:"center",boxSizing:"border-box",outline:"none",fontFamily:"'DM Mono',monospace"}}/>
                        <span style={{color:C.muted,fontSize:9,fontWeight:600}}>{lbl}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Rate Setup */}
                <div>
                  <Lbl>RATE SETUP (QUALITY, NOT P&L)</Lbl>
                  <div style={{display:"flex",gap:4}}>
                    {GRADES.map(g=>(
                      <button key={g} onClick={()=>setForm(f=>({...f,grade:g}))} style={{flex:1,padding:"10px 2px",borderRadius:8,border:`2px solid ${form.grade===g?gradeColor(g):C.border}`,background:form.grade===g?`${gradeColor(g)}22`:"transparent",color:form.grade===g?gradeColor(g):C.muted,cursor:"pointer",fontWeight:800,fontSize:12,fontFamily:"inherit",transition:"all .15s"}}>{g}</button>
                    ))}
                  </div>
                </div>

                {/* Save */}
                <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:4}}>
                  <button onClick={saveTrade} style={{width:"100%",background:C.green,color:"#000",border:"none",padding:"13px",borderRadius:8,cursor:"pointer",fontWeight:900,fontSize:13,fontFamily:"inherit"}}>
                    {editId?"Update Trade ✓":"Save Trade ✓"}
                  </button>
                  <button onClick={()=>setShowForm(false)} style={{width:"100%",background:"transparent",color:C.muted,border:`1px solid ${C.border}`,padding:"9px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:12}}>Cancel</button>
                </div>

              </div>{/* end right column */}
            </div>{/* end grid */}
          </div>{/* end modal box */}
        </div>/* end overlay */
      )}
    </div>
  );
}

function CalendarWidget({ data, trades, onDayClick }) {
  const year=2025, month=5;
  const firstDay=new Date(year,month,1).getDay();
  const days=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=days;d++) cells.push(d);
  const maxAbs=Math.max(...Object.values(data).map(Math.abs),1);
  const tradesByDate={};
  (trades||[]).forEach(t=>{if(!tradesByDate[t.date])tradesByDate[t.date]=0; tradesByDate[t.date]++;});
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontWeight:800,fontSize:15}}>June 2025</div>
        <div style={{display:"flex",gap:5}}>
          <button style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"3px 8px",borderRadius:4,cursor:"pointer"}}>‹</button>
          <button style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"3px 8px",borderRadius:4,cursor:"pointer"}}>›</button>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:5}}>
        {["Mo","Tu","We","Th","Fr","Sa","Su"].map(d=><div key={d} style={{textAlign:"center",color:C.muted,fontSize:9,padding:"3px 0",fontWeight:700}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {cells.map((d,i)=>{
          if(!d) return <div key={i}/>;
          const ds=`2025-06-${String(d).padStart(2,"0")}`;
          const pnl=data[ds];
          const count=tradesByDate[ds]||0;
          const hasTrade=pnl!==undefined;
          const intensity=hasTrade?Math.min(Math.abs(pnl)/maxAbs,1)*0.85+0.15:0;
          const bg=hasTrade?(pnl>=0?`rgba(34,197,94,${intensity})`:`rgba(239,68,68,${intensity})`):"transparent";
          return (
            <div key={d} onClick={()=>hasTrade&&onDayClick&&onDayClick(ds)}
              style={{background:bg,border:`1px solid ${d===14?C.green:hasTrade?"transparent":C.border}`,borderRadius:5,padding:"4px 3px",minHeight:52,cursor:hasTrade?"pointer":"default",transition:"opacity .1s"}}
              onMouseEnter={e=>{ if(hasTrade) e.currentTarget.style.opacity=".8"; }}
              onMouseLeave={e=>{ e.currentTarget.style.opacity="1"; }}>
              <div style={{fontSize:9,color:hasTrade?"#fff":C.muted,fontWeight:d===14?800:400}}>{d}</div>
              {hasTrade && <div style={{fontSize:9,color:"#fff",fontWeight:700,marginTop:1}}>{pnl>=0?"+$":"-$"}{Math.abs(pnl).toFixed(0)}</div>}
              {hasTrade && count>0 && <div style={{fontSize:8,color:"#ffffff99",marginTop:2}}>{count} trade{count>1?"s":""}</div>}
              {!hasTrade && d<=14 && <div style={{fontSize:8,color:C.muted2,marginTop:1}}>No Trade</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CalendarFull({ data, trades }) {
  const year=2025, month=5;
  const firstDay=new Date(year,month,1).getDay();
  const days=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=days;d++) cells.push(d);
  const maxAbs=Math.max(...Object.values(data).map(Math.abs),1);
  return (
    <Card>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:8}}>
        {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=><div key={d} style={{textAlign:"center",color:C.muted,fontSize:10,padding:4,fontWeight:700}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
        {cells.map((d,i)=>{
          if(!d) return <div key={i}/>;
          const ds=`2025-06-${String(d).padStart(2,"0")}`;
          const pnl=data[ds];
          const dt=trades.filter(t=>t.date===ds);
          const hasTrade=pnl!==undefined;
          const intensity=hasTrade?Math.min(Math.abs(pnl)/maxAbs,1)*0.8+0.15:0;
          const bg=hasTrade?(pnl>=0?`rgba(34,197,94,${intensity})`:`rgba(239,68,68,${intensity})`):"transparent";
          return (
            <div key={d} style={{background:bg,border:`1px solid ${hasTrade?"transparent":C.border}`,borderRadius:7,padding:"7px 6px",minHeight:65}}>
              <div style={{fontSize:10,color:hasTrade?"#ffffffaa":C.muted,fontWeight:600,marginBottom:3}}>{d}</div>
              {hasTrade
                ? <div style={{fontSize:12,color:"#fff",fontWeight:800}}>{pnl>=0?"+$":"-$"}{Math.abs(pnl).toFixed(0)}</div>
                : d<=14 && <div style={{fontSize:9,color:C.muted2,fontStyle:"italic"}}>No Trade</div>}
              {dt.length>1 && <div style={{fontSize:8,color:"#ffffff88",marginTop:2}}>{dt.length} trades</div>}
            </div>
          );
        })}
      </div>
    </Card>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
